{{- if .Values.redis.enabled }}
# Internal-only: headless ClusterIP, no external exposure. The NetworkPolicy
# additionally restricts ingress to gateway pods on 6379.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcpip.redis.fullname" . }}
  labels:
    {{- include "mcpip.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "mcpip.redis.selectorLabels" . | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
{{- end }}
