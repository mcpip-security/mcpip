# STRUCTURE ONLY — populate out-of-band; never commit real material.
#
# The gateway consumes exactly these three keys, mounted read-only at
# /etc/mcpip/keys (see deploy/k8s/deployment.yaml):
#   jwt_public.pem   — trusted IdP JWT verification PUBLIC key (PEM)
#   worm_signing.pem — Ed25519 PKCS8 audit epoch-signing PRIVATE key
#   license.json     — signed MCPIP license file
#
# Create it directly from files, bypassing this manifest entirely:
#   kubectl -n mcpip create secret generic mcpip-keys \
#     --from-file=jwt_public.pem=/secure/path/jwt_public.pem \
#     --from-file=worm_signing.pem=/secure/path/worm_signing.pem \
#     --from-file=license.json=/secure/path/license.json
#
# Or use a sealed-secrets / external-secrets operator. The values below are
# intentionally empty; the gateway fails closed at boot if they stay empty.
apiVersion: v1
kind: Secret
metadata:
  name: mcpip-keys
  namespace: mcpip
  labels:
    app.kubernetes.io/name: mcpip
    app.kubernetes.io/component: gateway
type: Opaque
stringData:
  jwt_public.pem: ""
  worm_signing.pem: ""
  license.json: ""
