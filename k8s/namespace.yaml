apiVersion: v1
kind: Namespace
metadata:
  name: mcpip
  labels:
    app.kubernetes.io/name: mcpip
    kubernetes.io/metadata.name: mcpip
    # Baseline for the pod-security admission controller; every pod in this
    # namespace already satisfies `restricted`.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
