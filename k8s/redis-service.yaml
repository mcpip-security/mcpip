# Internal-only: headless ClusterIP, no external exposure. The NetworkPolicy
# additionally restricts ingress to gateway pods on 6379.
apiVersion: v1
kind: Service
metadata:
  name: mcpip-redis
  namespace: mcpip
  labels:
    app.kubernetes.io/name: mcpip
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: mcpip
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
