# Non-secret gateway configuration. Secret material (JWT public key, WORM
# epoch-signing key, license file) is NEVER placed here — it arrives via the
# pre-created Secret `mcpip-keys` (see secret.example.yaml) mounted read-only
# at /etc/mcpip/keys.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcpip-gateway-config
  namespace: mcpip
  labels:
    app.kubernetes.io/name: mcpip
    app.kubernetes.io/component: gateway
data:
  MCPIP_REDIS_URL: "redis://mcpip-redis:6379/0"
  MCPIP_WORM_PATH: "/var/lib/mcpip/mcpip_worm.jsonl"
  MCPIP_JWT_PUBLIC_KEY_PATH: "/etc/mcpip/keys/jwt_public.pem"
  MCPIP_WORM_SIGNING_KEY_PATH: "/etc/mcpip/keys/worm_signing.pem"
  MCPIP_LICENSE_PATH: "/etc/mcpip/keys/license.json"
  MCPIP_LICENSE_PUBLIC_KEY_PATH: "/app/release/keys/license_root_ed25519.pub.pem"
  MCPIP_INTEGRITY_MANIFEST_PATH: "/app/release/integrity_manifest.json"
  MCPIP_INTEGRITY_PUBLIC_KEY_PATH: "/app/release/keys/release_root_ed25519.pub.pem"
  MCPIP_WORKERS: "4"
  MCPIP_API_PORT: "8080"
  PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus"
