apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcpip.fullname" . }}
  labels:
    {{- include "mcpip.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "mcpip.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
