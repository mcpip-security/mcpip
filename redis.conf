# =============================================================================
# MCPIP — WORM audit durability profile for Redis.
#
# The hybrid Merkle-epoch WORM's write-before-execute invariant requires that the
# audit buffer XADD is fsync-durable BEFORE /v1/authorize returns allow. That holds
# ONLY with the Append-Only File enabled and every write fsync'd synchronously:
#
#     appendonly yes        — persist every write to the AOF (not just periodic RDB).
#     appendfsync always    — fsync the AOF on EVERY write, so an acknowledged emit is
#                             already on stable storage; a crash cannot lose an
#                             already-authorized action's audit event.
#
# The gateway ASSERTS this posture at boot (audit.worm_logger.assert_persistence_posture)
# and, in a non-sandbox (production) deployment, REFUSES TO START if it is not met.
#
# The AOF must live on a DURABLE volume (not a tmpfs), so docker-compose mounts a named
# volume at /data for the redis service that loads this file.
# =============================================================================

appendonly yes
appendfsync always

# No RDB snapshots — the always-fsync AOF is the durability mechanism.
save ""

# Keep the AOF compact without ever weakening the fsync guarantee. A rewrite is a
# background operation; appendfsync=always still governs every incremental write.
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Never serve or persist a partially-written AOF as if intact.
aof-load-truncated no

# Never evict keys under memory pressure. The WORM audit buffer and the
# one-time-PIN replay guard live in Redis; evicting either would silently
# break the write-before-execute / no-replay invariants. Pin noeviction
# explicitly rather than relying on it only being the default while maxmemory=0.
maxmemory-policy noeviction

# The gateway is the only client on the internal network; bind is handled by Docker.
protected-mode no
