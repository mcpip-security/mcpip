name: Desktop Release (DMG · MSI · DEB · AppImage)

# Bundles the MCPIP Operator Console natively per OS. DMG/.app and MSI can ONLY be
# built on macOS / Windows runners respectively — this matrix does exactly that.
on:
  workflow_dispatch: {}
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest       # → .dmg + .app (universal)
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04       # → .deb + .AppImage
            args: ""
          - platform: windows-latest     # → .msi (WiX Toolset)
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo + target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: dashboard/src-tauri -> target

      - name: Linux bundling dependencies (webkit2gtk for .deb/.AppImage)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libappindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install frontend dependencies
        working-directory: dashboard
        run: npm ci

      - name: Generate platform icon set from source (◐)
        working-directory: dashboard
        run: npm run desktop:icons

      # `tauri build` runs the frontend build (beforeBuildCommand) then bundles
      # per tauri.conf.json targets, in --release (stripped, LTO, panic=abort).
      - name: Build & bundle
        working-directory: dashboard
        run: npm run tauri -- build ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: mcpip-operator-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dashboard/src-tauri/target/**/release/bundle/dmg/*.dmg
            dashboard/src-tauri/target/**/release/bundle/macos/*.app
            dashboard/src-tauri/target/**/release/bundle/msi/*.msi
            dashboard/src-tauri/target/**/release/bundle/deb/*.deb
            dashboard/src-tauri/target/**/release/bundle/appimage/*.AppImage

  # The matrix above only produces Actions artifacts: they expire, require a
  # GitHub login to fetch, and have no stable URL — so nothing can be linked from
  # the website. This job attaches the same bundles to a public Release, which is
  # what gives them permanent, anonymous download URLs.
  release:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write        # narrower than the workflow default; only this job publishes
    steps:
      - name: Collect every platform's bundles
        uses: actions/download-artifact@v4
        with:
          pattern: mcpip-operator-*
          merge-multiple: true
          path: dist

      # Flatten: the upload preserved each bundle's nested target/ path, and a
      # release asset list cannot contain directories.
      - name: Flatten and checksum
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.deb' \
            -o -name '*.AppImage' \) -exec cp -n {} out/ \;
          test -n "$(ls -A out)" || { echo "::error::no installers found"; exit 1; }
          cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS

      # gh is preinstalled on the runner — no third-party action in the release
      # path of a security product.
      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "MCPIP Operator Console ${GITHUB_REF_NAME#desktop-}" \
            --notes "Desktop console installers for macOS, Windows, and Linux.

          Verify before installing:

              sha256sum -c SHA256SUMS

          Built from \`${GITHUB_SHA}\` by \`.github/workflows/desktop-release.yml\`." \
            --verify-tag
