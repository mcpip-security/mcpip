name: CI

# The merge gate a security product must wear: every PR and every push to main
# runs the full backend suite against a REAL Redis, the SDK's strict typecheck,
# and both client builds. Scope is exactly what is verifiably green today —
# repo-wide `mypy --strict .` is stub-version-sensitive and is tracked as
# follow-up work, not encoded here to rot as a red badge.
on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + SDK mypy --strict)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["63790:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Full test suite (real Redis, sandbox namespaces)
        run: python -m pytest -q
      - name: SDK strict typecheck
        run: PYTHONPATH=sdk/python/src python -m mypy --strict sdk/python/src/mcpip_sdk

  supply-chain:
    name: Supply-chain (CVE scan + manifest drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Change-integrity: the committed signed integrity manifest must track the
      # source tree. WARN-only today (the 3.0.0 owner re-sign is pending); flip to
      # `--strict` once the manifest is re-signed at the current VERSION so any
      # future drift is a hard PR failure.
      - name: Integrity-manifest drift check (warn)
        run: python scripts/check_integrity_manifest_drift.py
      # Dependency CVE scan. Advisory for now (a new upstream CVE should surface
      # here, not silently block the merge gate before triage). Make it blocking
      # by removing `continue-on-error` once the dependency set is on a hashed
      # lock.
      - name: pip-audit (advisory)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --desc on || true
      # Static application security testing. Runner-local (no GitHub Advanced
      # Security / SARIF upload needed, so it works on a private repo). Advisory:
      # findings surface in the log for triage without blocking the merge gate.
      - name: bandit SAST (advisory)
        continue-on-error: true
        run: |
          python -m pip install --upgrade bandit
          bandit -q -ll -r app core auth audit bridge services obfuscator models \
            interfaces.py main.py || true

  manifests:
    name: Deploy manifests (kubeconform + helm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Schema validation of the raw manifests. `-strict` rejects unknown fields,
      # which is the half that matters: a typo'd key is otherwise accepted and
      # silently ignored by the API server. CRDs (PrometheusRule) have no schema
      # in the default store, hence --ignore-missing-schemas; the summary line
      # reports how many were skipped so that stays visible rather than implied.
      #
      # Scope note: kubeconform validates SHAPE. It does NOT model ConfigMap/Secret
      # key charset, nor whether a mounted key is the one a container actually
      # reads — a path-shaped ConfigMap key passes here and is rejected by the API
      # server. Those rules live in tests/test_deploy_manifests.py.
      - name: kubeconform (deploy/k8s)
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary -ignore-missing-schemas deploy/k8s/
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: helm lint + render + validate (deploy/chart)
        run: |
          helm lint deploy/chart
          for values in values.yaml values-compliance.yaml; do
            echo "── rendering with $values"
            helm template mcpip deploy/chart -f "deploy/chart/$values" \
              | ./kubeconform -strict -summary -ignore-missing-schemas -
          done

  clients:
    name: Console + TS SDK builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Console typecheck + production build
        working-directory: dashboard
        run: |
          npm ci
          npm run build
      - name: TypeScript SDK build (incl. the mcpip bin)
        # Self-contained: cli.ts uses Node globals (process/Buffer), so the SDK
        # needs @types/node in scope — install locally (no lockfile in sdk/ts).
        working-directory: sdk/typescript
        run: |
          npm i --no-save typescript @types/node
          ./node_modules/.bin/tsc -p tsconfig.json
