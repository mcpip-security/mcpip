# Dependency vulnerability monitoring & update automation.
#
# Automated dependency/CVE scanning (SOC 2 CC7.1): Dependabot opens PRs for
# known-vulnerable and out-of-date dependencies across every ecosystem the repo
# ships, so a new CVE in a pinned dependency is surfaced as a reviewable PR
# instead of waiting on a manual offline `grype`/`trivy` run.
#
# TWO groups per ecosystem, and that split is the point.
#
# The previous config grouped only ["minor","patch"], so every MAJOR bump escaped
# its group and opened a PR of its own — and `github-actions` had no group at all.
# That produced 14 simultaneous open PRs (5 npm + 5 pip + 4 actions), which is
# both unreadable and actively harmful: a wall of PRs is a wall nobody reads, and
# the CVE fix this automation exists to surface gets lost in it.
#
# Majors are still proposed — never silently dropped, because a major can carry
# the security fix — but they arrive batched and labelled `major` so they are
# obviously a human decision rather than a rubber stamp. They earned that
# treatment: every breaking change found when the 14 were evaluated was a major
# (react-dom 19 against react 18, tailwind 3->4, typescript 5->7, redis 5->8 and
# pytest 8->9, which together hung the test suite past 10 minutes).
#
# Minor/patch stay in their own group so the safe set remains independently
# mergeable without waiting on a breaking-change review.
#
# The five packages below are IGNORED at major, individually and with a reason
# each. Grouping cut 14 PRs to 5, but a major group still reopens every week
# carrying the same changes that were already evaluated and rejected — a standing
# red PR nobody can action is noise that trains people to ignore the queue.
#
# This does NOT blind the repo to CVEs. Dependabot's alerting is unchanged, and
# `pip-audit` runs in CI on every PR and push (.github/workflows/ci.yml,
# supply-chain job) against requirements.txt directly. The ignores suppress
# *version* churn, not vulnerability reporting. Drop an entry when someone does
# that migration deliberately.
version: 2
updates:
  # --- Python runtime + dev deps (root requirements*.txt). --------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      python-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-deps-major:
        patterns: ["*"]
        update-types: ["major"]
    labels: ["dependencies", "supply-chain"]
    ignore:
      # Verified: redis 8 + pytest 9 together hung the suite past 10 minutes
      # (it normally completes in ~40s). Not diagnosed further — a WORM ledger
      # on an untested Redis major is not a change to wave through.
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pytest"
        update-types: ["version-update:semver-major"]

  # --- Operator console (Vite/React). ----------------------------------------
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      console-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      console-deps-major:
        patterns: ["*"]
        update-types: ["major"]
    labels: ["dependencies", "supply-chain", "console"]
    ignore:
      # react-dom 19 was proposed against react pinned at 18 — a mismatched pair
      # that breaks at render. Bump react and react-dom together, deliberately.
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # tailwind 3 -> 4 is a CSS-first config rewrite, not a version bump.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # typescript 5 -> 7 spans two majors; needs a real typecheck pass.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # --- CI workflow actions (pin bumps + security). ---------------------------
  # Grouped now. Ungrouped, four routine action bumps became four PRs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      ci-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      ci-actions-major:
        patterns: ["*"]
        update-types: ["major"]
    labels: ["dependencies", "supply-chain", "ci"]
